name: macOS build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so the version-stamp script can read the latest release tag

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test (unsigned)
        # Unit tests only; the UI tests (TickyTaskUITests) run in their own
        # workflow, ui-tests.yml, on pushes to feature branches.
        run: |
          xcodebuild test \
            -project TickyTask.xcodeproj \
            -scheme TickyTask \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:TickyTaskTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
