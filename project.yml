name: TickyTask

options:
  bundleIdPrefix: com.tickytask
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

settings:
  base:
    MARKETING_VERSION: "0.1.6"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Catch real cross-actor issues without SwiftData's spurious non-Sendable
    # key-path noise. Full `complete` / Swift 6 is revisited in P13 hardening.
    SWIFT_STRICT_CONCURRENCY: targeted
    PRODUCT_BUNDLE_IDENTIFIER: com.tickytask.mac
    # Unsigned local + CI builds (no Apple Developer account required).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  TickyTask:
    type: application
    platform: macOS
    sources:
      - path: Sources/TickyTask
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        INFOPLIST_FILE: Sources/TickyTask/Support/Info.plist
        PRODUCT_NAME: TickyTask
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Stamp version from latest git tag
        basedOnDependencyAnalysis: false
        script: |
          # Make the About version follow the release: CFBundleShortVersionString
          # from the latest git tag (v0.1.0 -> 0.1.0) and CFBundleVersion from the
          # commit count (a unique, increasing build number). Both no-op when
          # there are no tags / not a git checkout (e.g. shallow CI clones), so
          # MARKETING_VERSION/CURRENT_PROJECT_VERSION stay as the fallback. Runs
          # before the implicit CodeSign step, so the signature stays valid.
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          [ -f "$PLIST" ] || exit 0
          TAG=$(cd "$SRCROOT" && git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          if [ -n "$TAG" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $TAG" "$PLIST"
          fi
          BUILD=$(cd "$SRCROOT" && git rev-list --count HEAD 2>/dev/null)
          if [ -n "$BUILD" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          fi
    scheme:
      testTargets:
        - TickyTaskTests
        - TickyTaskUITests

  TickyTaskTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TickyTaskTests
    dependencies:
      - target: TickyTask
    settings:
      base:
        # Generate the test bundle's Info.plist explicitly (don't rely on
        # xcodegen's implicit default, which varies by version) so ad-hoc
        # code-signing of the test bundle always has one, and give it its own
        # bundle id so it doesn't collide with the app's.
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.tickytask.mac.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TickyTask.app/Contents/MacOS/TickyTask"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # UI-test target: launches the app (with -uitest → isolated in-memory store +
  # seeded tasks) and performs real drag gestures to verify reordering end-to-end.
  TickyTaskUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/TickyTaskUITests
    dependencies:
      - target: TickyTask
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.tickytask.mac.uitests
        TEST_TARGET_NAME: TickyTask
